site_name: CySec
site_description: Professional Cybersecurity Knowledge Base — Offensive Security, Pentesting, Red Teaming
site_author: Malik Azad
site_url: https://malik-azad.github.io/CySec
repo_url: https://github.com/malik-azad/CySec
repo_name: malik-azad/CySec
edit_uri: edit/main/docs/
copyright: © 2026 Malik Azad. Licensed under CC BY-NC-SA 4.0.

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow
    - toc.integrate
  icon:
    repo: fontawesome/brands/github
    logo: material/shield-lock
    admonition:
      note: material/information-outline
      tip: material/lightbulb-outline
      warning: material/alert-outline
      danger: material/skull-crossbones
      example: material/flask-outline
      abstract: material/book-outline

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]\(\)"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
      min_search_length: 3
      prebuild_index: true
  - tags
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      format: "dd MMM yyyy"
  - git-authors:
      show_contribution: true
      show_line_count: true
  - macros
  - mermaid2:
      version: "10.9.0"

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user_url_shorthand: true
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - def_list
  - footnotes
  - abbr
  - meta

